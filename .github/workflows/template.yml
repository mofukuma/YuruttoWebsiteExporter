# Godot stableへ対応したaddonを固定containerから作り、そのままrelease配布する手動workflow。
# 対応Godot版ごとに、同じ入口からエクスポートテンプレートと由来manifestを揃える。

name: Build export template

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 公開するreleaseのtag。空ならartifactを作る。
        required: false
        default: ''

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build export template
        run: sh build/build_distribution.sh
      - name: Check distribution
        run: |
          node tests/template_distribution.cjs
          node tests/licenses.cjs
      - name: Package addon
        run: |
          cp LICENSE addons/yurutto_website_exporter/LICENSE.txt
          zip -r -q -9 "$RUNNER_TEMP/YuruttoWebsiteExporter.zip" addons/yurutto_website_exporter
          cd "$RUNNER_TEMP"
          sha256sum YuruttoWebsiteExporter.zip > YuruttoWebsiteExporter.zip.sha256
      - name: Attest addon
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/YuruttoWebsiteExporter.zip
      - name: Upload addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yweb-site-${{ github.sha }}
          path: |
            ${{ runner.temp }}/YuruttoWebsiteExporter.zip
            ${{ runner.temp }}/YuruttoWebsiteExporter.zip.sha256
          if-no-files-found: error

  test:
    needs: template
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yweb-site-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Install candidate
        run: unzip -o -q "$RUNNER_TEMP/candidate/YuruttoWebsiteExporter.zip" -d "$GITHUB_WORKSPACE"
      - name: Install test runtime
        env:
          GODOT_EDITOR_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9
        run: |
          . build/source.lock
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$archive"
          printf '%s  %s\n' "$GODOT_EDITOR_SHA512" "$archive" | sha512sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          printf 'GODOT_BIN=%s\n' "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p tmp/playwright
          cp tests/browser/package.json tests/browser/package-lock.json tmp/playwright/
          npm ci --prefix tmp/playwright --ignore-scripts
          PLAYWRIGHT_BROWSERS_PATH="$PWD/tmp/playwright-browsers" node tmp/playwright/node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Check candidate
        run: |
          "$GODOT_BIN" --headless --path . --script tests/production_check.gd
          node tests/site_export.cjs

  release:
    if: inputs.release_tag != '' && github.ref == 'refs/heads/main'
    needs: [template, test]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yweb-site-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in *[!A-Za-z0-9._-]*|'') exit 2;; esac
          godot=$(unzip -p "$RUNNER_TEMP/release/YuruttoWebsiteExporter.zip" addons/yurutto_website_exporter/templates/manifest.json | jq -r .godot.version)
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/YuruttoWebsiteExporter.zip" \
            "$RUNNER_TEMP/release/YuruttoWebsiteExporter.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Godot $godot 用のエクスポートテンプレート同梱。checksumとGitHub artifact attestationで由来を確認できる。"
