; Web font境界をminimum runtimeで書き出す設定。

[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
export_path="../../tmp/webfont/site/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
progressive_web_app/enabled=false
gdweb/site/enabled=true
gdweb/site/config="res://gdweb-site.json"
gdweb/site/base_url="https://example.com"
gdweb/site/title="Web Font Test"
gdweb/site/description="Theme Web font test"
gdweb/site/locale="ja_JP"
gdweb/site/favicon=""
gdweb/routing/mode=0
gdweb/font/matching_webfont=true
gdweb/ogp/image=""
gdweb/ogp/frame=2
gdweb/ogp/alt="Web font test"
