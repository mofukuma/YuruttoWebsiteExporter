; Web font境界をminimumテンプレートで書き出す設定。

[preset.0]

name="Web"
platform="Yurutto Website"
runnable=true
export_filter="all_resources"
export_path="../../tmp/webfont/site/index.html"
script_export_mode=2

[preset.0.options]

yweb/site/enabled=true
yweb/site/config="res://yweb-site.json"
yweb/site/base_url="https://example.com"
yweb/site/title="Web Font Test"
yweb/site/description="Theme Web font test"
yweb/site/locale="ja_JP"
yweb/site/favicon=""
yweb/routing/mode=0
yweb/font/matching_webfont=true
yweb/ogp/image=""
yweb/ogp/frame=2
yweb/ogp/alt="Web font test"
vram_texture_compression/for_desktop=true
html/focus_canvas_on_start=true
yweb/font/avoid_canvas_theme_font=true
