; GodotとWebの絵を同じ条件で比べるための書き出し設定。

[preset.0]

name="Web"
platform="Yurutto Website"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../../tmp/pixel-parity/site/index.html"
script_export_mode=2

[preset.0.options]

html/focus_canvas_on_start=false
yweb/site/enabled=true
yweb/site/base_url="http://127.0.0.1:49191"
yweb/site/title="Pixel Parity"
yweb/site/description="pixel comparison"
yweb/site/locale="en"
yweb/routing/mode=0
yweb/font/matching_webfont=true
yweb/font/avoid_canvas_theme_font=true
