; DOM onlyテンプレートで物理pageを共有runtimeへ書き出す設定。

[preset.0]

name="Web"
platform="Yurutto Website"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="output/*"
export_path="output/index.html"
script_export_mode=2

[preset.0.options]

vram_texture_compression/for_desktop=true
html/focus_canvas_on_start=true
yweb/level=0
yweb/site/enabled=true
yweb/site/config="res://yweb-site.json"
yweb/site/base_url="http://127.0.0.1:4173"
yweb/site/title="Luma Studio"
yweb/site/description="ブランドとデジタル体験を設計するLuma StudioのGodot製Webサイト。"
yweb/site/locale="ja_JP"
yweb/site/favicon=""
yweb/font/matching_webfont=true
yweb/font/avoid_canvas_theme_font=true
yweb/ogp/image="res://images/facade.jpg"
yweb/ogp/alt="色彩豊かな建築とLuma Studioのサイト"
yweb/ogp/frame=2
