; minimumテンプレートで全機能実験場を書き出す設定。

[preset.0]

name="Web"
platform="Yurutto Website"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../tmp/text-lab/site/index.html"
script_export_mode=2

[preset.0.options]

vram_texture_compression/for_desktop=true
html/focus_canvas_on_start=true
yweb/site/enabled=true
yweb/site/config="res://yweb-site.json"
yweb/site/base_url="https://example.com"
yweb/site/description="Godotで作成したWebサイトです。"
yweb/site/locale="ja_JP"
yweb/site/favicon=""
yweb/font/matching_webfont=true
yweb/ogp/image="res://web/ogp.png"
yweb/ogp/frame=2
yweb/ogp/alt="サイトのプレビュー画像"
yweb/font/avoid_canvas_theme_font=true

[preset.1]

name="Standard Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../tmp/text-lab/standard/index.html"
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
