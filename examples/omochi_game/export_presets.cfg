; minimumテンプレートでOmochi捕獲ゲームを書き出す設定。

[preset.0]

name="Web"
platform="Yurutto Website"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../tmp/omochi-game/site/index.html"
script_export_mode=2

[preset.0.options]

vram_texture_compression/for_desktop=true
html/focus_canvas_on_start=true
yweb/site/enabled=true
yweb/site/config="res://yweb-site.json"
yweb/site/base_url="https://example.com"
yweb/site/title="Godou-san Omochi Catch"
yweb/site/description="ゴドウさんを動かして、落ちてくるおもちを受け取る2D物理ゲーム。"
yweb/site/locale="ja_JP"
yweb/site/favicon=""
yweb/routing/mode=0
yweb/font/matching_webfont=true
yweb/ogp/image="res://web/ogp.png"
yweb/ogp/alt="坂とピンを落ちるおもちとゴドウさんの捕獲機"
yweb/ogp/frame=2
yweb/font/avoid_canvas_theme_font=true
