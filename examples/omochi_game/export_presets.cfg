; minimum runtimeでOmochi捕獲ゲームを書き出す設定。

[preset.0]

name="Web"
platform="ゆるっとWeb"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../tmp/omochi-game/site/index.html"
script_export_mode=2

[preset.0.options]

vram_texture_compression/for_desktop=true
html/focus_canvas_on_start=true
gdweb/site/enabled=true
gdweb/site/config="res://gdweb-site.json"
gdweb/site/base_url="https://example.com"
gdweb/site/title="Godou-san Omochi Catch"
gdweb/site/description="ゴドウさんを動かして、落ちてくるおもちを受け取る2D物理ゲーム。"
gdweb/site/locale="ja_JP"
gdweb/site/favicon=""
gdweb/routing/mode=0
gdweb/font/matching_webfont=true
gdweb/ogp/image="res://web/ogp.png"
gdweb/ogp/alt="坂とピンを落ちるおもちとゴドウさんの捕獲機"
gdweb/ogp/frame=2
gdweb/font/avoid_canvas_theme_font=true
