; 標準Control検証用のminimum Web書き出し設定。

[preset.0]

name="Web"
platform="ゆるっとWebサイト"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../tmp/form-controls/site/index.html"
script_export_mode=2

[preset.0.options]

vram_texture_compression/for_desktop=true
html/focus_canvas_on_start=true
yuruttoweb/site/enabled=true
yuruttoweb/font/avoid_canvas_theme_font=true
yuruttoweb/font/matching_webfont=true
yuruttoweb/site/config="res://yuruttoweb-site.json"
yuruttoweb/site/base_url="https://example.com"
yuruttoweb/site/description="Godotで作成したWebサイトです。"
yuruttoweb/site/locale="ja_JP"
yuruttoweb/site/favicon=""
yuruttoweb/routing/mode=0
yuruttoweb/ogp/image="res://web/ogp.png"
yuruttoweb/ogp/alt="サイトのプレビュー画像"
yuruttoweb/ogp/frame=2
