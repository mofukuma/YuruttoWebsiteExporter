# ゆるっとWeb成果物をHistory fallbackとBrotli付きで配信する設定。
# /etc/nginx/conf.d/default.confへ配置する想定。

map $http_accept_encoding $gdweb_br_suffix {
    default "";
    "~*(?:^|,)\s*br\s*;\s*q=0(?:\.0*)?\s*(?:,|$)" "";
    "~*(?:^|,)\s*br(?:\s*;[^,]*)?\s*(?:,|$)" ".br";
}
map $gdweb_br_suffix $gdweb_content_encoding {
    default "";
    ".br" br;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # GDWEB_BASE_PATH

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Content-Encoding $gdweb_content_encoding always;
        add_header Vary Accept-Encoding always;
        try_files $uri$gdweb_br_suffix @gdweb_wasm_raw;
    }
    location @gdweb_wasm_raw {
        default_type application/wasm;
        add_header Vary Accept-Encoding always;
        try_files $uri =404;
    }
    location ~* \.js$ {
        default_type application/javascript;
        add_header Content-Encoding $gdweb_content_encoding always;
        add_header Vary Accept-Encoding always;
        try_files $uri$gdweb_br_suffix @gdweb_js_raw;
    }
    location @gdweb_js_raw {
        default_type application/javascript;
        add_header Vary Accept-Encoding always;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
