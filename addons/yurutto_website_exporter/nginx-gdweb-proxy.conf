# 既存static originへHistory fallbackを追加するreverse proxy例。
# upstream名と公開serverへ合わせて使用する想定。

upstream gdweb_origin {
    server static-origin:8080;
}
server {
    listen 8080;
    server_name _;

    # GDWEB_BASE_PATH

    location / {
        proxy_pass http://gdweb_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @gdweb_shell;
    }
    location @gdweb_shell {
        proxy_pass http://gdweb_origin/index.html;
    }
}
