# 既存static originへHistory fallbackを追加するreverse proxy例。
# upstream名と公開serverへ合わせて使用する想定。

upstream yuruttoweb_origin {
    server static-origin:8080;
}
server {
    listen 8080;
    server_name _;

    # YURUTTOWEB_BASE_PATH

    location / {
        proxy_pass http://yuruttoweb_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @yuruttoweb_shell;
    }
    location @yuruttoweb_shell {
        proxy_pass http://yuruttoweb_origin/index.html;
    }
}
